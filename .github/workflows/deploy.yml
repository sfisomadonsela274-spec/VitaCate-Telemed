name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: vitacare-ng/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vitacare-ng

      - name: Build
        run: npx ng build --configuration production --base-href /VitaCate-Telemed/
        working-directory: vitacare-ng

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: vitacare-ng/dist/vitacare-ng/browser
          branch: gh-pages
