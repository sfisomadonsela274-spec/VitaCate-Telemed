services:
  # Django Backend Service
  - type: web
    name: vitacare-api
    env: python
    buildCommand: "./vitacare/build.sh"
    startCommand: "cd vitacare && daphne vitacare.asgi:application --port $PORT --bind 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vitacare-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vitacare-redis
          property: connectionString
      - key: FRONTEND_URL
        value: "https://your-app-name.netlify.app" # To be updated after Netlify deployment

# Managed Database (PostgreSQL)
databases:
  - name: vitacare-db
    plan: free

# Managed Key-Value Store (Redis)
# Note: For free tier, use Render's Redis service or an external Redis like Upstash
redis:
  - name: vitacare-redis
    plan: free
